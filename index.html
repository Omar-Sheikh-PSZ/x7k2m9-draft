<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draft Room — 26/27</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --ink:#0b1119; --panel:#111c2b; --panel2:#162334; --line:#243549;
  --text:#e8edf4; --dim:#78899f; --amber:#e8a33d; --mint:#5fd3a5; --coral:#e8756b; --violet:#9d8cf0;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--ink);color:var(--text);font-family:'IBM Plex Mono',monospace}
body{padding:10px 8px 30px;max-width:760px;margin:0 auto}
h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:17px;letter-spacing:.02em;text-transform:uppercase}
h1 span{color:var(--amber)}
.sub{color:var(--dim);font-size:10px;margin:2px 0 10px}

/* view switch */
.views{display:flex;gap:5px;margin-bottom:9px}
.vbtn{flex:1;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;border:1px solid var(--line);
  background:var(--panel);color:var(--dim);padding:9px 6px;border-radius:5px;cursor:pointer;position:relative}
.vbtn.on{background:var(--amber);border-color:var(--amber);color:#101010}
.vbtn .badge{position:absolute;top:-6px;right:-6px;background:var(--violet);color:#101010;font-size:9px;
  font-weight:700;border-radius:9px;padding:1px 5px;min-width:16px}
.vbtn.on .badge{background:#101010;color:var(--amber)}

.controls{display:flex;gap:5px;margin-bottom:7px;flex-wrap:wrap}
.ctl{font-size:10.5px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--dim);
  padding:6px 9px;border-radius:4px;cursor:pointer}
.ctl.on{background:var(--panel2);border-color:var(--amber);color:var(--text)}
.hint{color:var(--dim);font-size:9px;margin:4px 2px 7px;letter-spacing:.04em;text-transform:uppercase}

.row{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 9px;margin-bottom:5px;
  display:flex;align-items:center;gap:8px}
.row.taken{opacity:.3}
.row.taken .nm{text-decoration:line-through}
.rk{color:var(--amber);font-weight:600;font-size:11px;min-width:26px}
.info{flex:1;min-width:0}
.nm{font-family:'Archivo',sans-serif;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--dim);font-size:9.5px;margin-top:1px}
.chip{display:inline-block;font-size:9px;padding:1px 4px;border-radius:3px;margin-left:4px;font-weight:600}
.chip.steal{background:var(--mint);color:#0b1119}
.chip.rich{background:var(--coral);color:#0b1119}
.chip.adp{background:var(--panel2);color:var(--dim)}
.vnum{text-align:right;min-width:38px}
.vnum b{font-size:14px;font-weight:600;display:block;color:var(--amber)}
.vnum span{font-size:8px;color:var(--dim);text-transform:uppercase}
.acts{display:flex;gap:4px}
.act{border:1px solid var(--line);background:var(--panel2);color:var(--text);width:30px;height:30px;
  border-radius:5px;font-size:15px;font-weight:600;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center}
.act.q{color:var(--violet)}
.act.d{color:var(--mint)}
.act.x{color:var(--coral);font-size:13px}
.act:active{transform:scale(.9)}

/* roster */
.formrow{display:flex;gap:5px;margin-bottom:9px;flex-wrap:wrap;align-items:center}
.formrow .lbl{font-size:10px;color:var(--dim);text-transform:uppercase}
.fbadge{font-family:'Archivo',sans-serif;font-weight:800;font-size:15px;padding:3px 10px;border-radius:5px;
  background:var(--panel2);border:1px solid var(--line)}
.fbadge.legal{border-color:var(--mint);color:var(--mint)}
.fbadge.illegal{border-color:var(--coral);color:var(--coral)}
.poscount{font-size:10px;color:var(--dim)}
.slotgroup{margin-bottom:10px}
.slothead{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:0 2px 4px;
  display:flex;justify-content:space-between}
.empty{color:var(--dim);font-size:10.5px;padding:9px;text-align:center;border:1px dashed var(--line);border-radius:6px}
.row.qrow{cursor:grab}
.row.dragging{opacity:.4;border-color:var(--violet)}
.row.dragover{border-color:var(--violet);border-style:dashed}
.grip{color:var(--dim);font-size:15px;cursor:grab;padding:0 3px;touch-action:none;user-select:none}
.qorder{color:var(--violet);font-weight:600;font-size:11px;min-width:20px}
.savebar{display:flex;gap:5px;align-items:center;margin-bottom:9px;flex-wrap:wrap}
.savebar button{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;border:1px solid var(--line);
  background:var(--panel);color:var(--dim);padding:6px 9px;border-radius:4px;cursor:pointer}
.savebar button:active{transform:scale(.94)}
.savestatus{font-size:9px;color:var(--mint);margin-left:auto}
.savestatus.warn{color:var(--coral)}
.modal{position:fixed;inset:0;background:rgba(5,9,15,.85);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.on{display:flex}
.modalbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;max-width:520px;width:100%}
.modalbox h3{font-family:'Archivo',sans-serif;font-size:13px;margin-bottom:8px}
.modalbox textarea{width:100%;height:120px;background:var(--ink);border:1px solid var(--line);color:var(--text);
  font-family:'IBM Plex Mono',monospace;font-size:10px;padding:8px;border-radius:5px;resize:vertical}
.modalbox .mrow{display:flex;gap:6px;margin-top:8px}
.modalbox .mrow button{flex:1;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:9px;
  border-radius:5px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
.modalbox .mrow button.primary{background:var(--amber);color:#101010;border-color:var(--amber)}
.total{background:var(--panel2);border:1px solid var(--amber);border-radius:6px;padding:9px 11px;margin-bottom:10px;
  display:flex;justify-content:space-between;align-items:baseline}
.total b{font-family:'Archivo',sans-serif;font-size:20px;color:var(--amber)}
.total span{font-size:10px;color:var(--dim);text-transform:uppercase}
.search{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
  font-family:'IBM Plex Mono',monospace;font-size:12px;padding:8px 10px;border-radius:5px;margin-bottom:7px}
.search::placeholder{color:var(--dim)}
</style>
</head>
<body>
<h1>Draft Room <span>// 26·27</span></h1>
<div class="sub">Tap → to queue · ✓ to draft to your team · ✕ marks drafted by others. Auto-saves on this device.</div>

<div class="savebar">
  <button id="btnReset">Reset draft</button>
  <button id="btnExport">Export backup</button>
  <button id="btnImport">Import backup</button>
  <span class="savestatus" id="saveStatus"></span>
</div>

<div class="modal" id="modal">
  <div class="modalbox">
    <h3 id="modalTitle">Backup</h3>
    <textarea id="modalText" placeholder="Paste a backup code here to restore…"></textarea>
    <div class="mrow">
      <button id="modalCopy">Copy</button>
      <button id="modalLoad" class="primary">Restore from text</button>
      <button id="modalClose">Close</button>
    </div>
  </div>
</div>

<div class="views">
  <button class="vbtn on" data-v="pool">Player Pool</button>
  <button class="vbtn" data-v="queue">Queue <span class="badge" id="qb">0</span></button>
  <button class="vbtn" data-v="team">My Team <span class="badge" id="tb">0</span></button>
</div>

<div id="poolControls">
  <input class="search" id="search" placeholder="search player or club…">
  <div class="controls" id="sorts">
    <button class="ctl on" data-s="v">VORP</button>
    <button class="ctl" data-s="d">Diff/G</button>
    <button class="ctl" data-s="pts">Pts</button>
    <button class="ctl" data-s="fpg">FP/G</button>
    <button class="ctl" data-s="adp">ADP</button>
  </div>
  <div class="controls" id="filters">
    <button class="ctl on" data-f="ALL">All</button>
    <button class="ctl" data-f="D">D</button>
    <button class="ctl" data-f="M">M</button>
    <button class="ctl" data-f="F">F</button>
    <button class="ctl" data-f="DUAL">Dual</button>
    <button class="ctl" data-f="AVAIL">Hide taken</button>
  </div>
</div>

<div id="list"></div>

function snapshot(){

    sort:state.sort, filt:state.filt });
}
function restore(str){
  try{
    const o=JSON.parse(str);
    state.taken=new Set(o.taken||[]); state.queue=o.queue||[]; state.team=o.team||[];
    if(o.sort)state.sort=o.sort; if(o.filt)state.filt=o.filt;
    return true;
  }catch(e){ return false; }
}
function save(){
  if(storageOK){ try{ localStorage.setItem(SAVE_KEY, snapshot()); flash('saved'); }catch(e){ flash('save failed','warn'); } }
  else { flash('open the downloaded file in Safari to auto-save','warn'); }
}

const byName = n => DATA.find(p=>p.n===n);
const posList = p => p.p.split(',');

// formation legality: 1GK implied, need D/M/F within 3-5 / 3-5 / 1-3, total 10 outfield for a full lineup
function bestFormation(team){
  // team = array of player objects. Try to fit into a legal XI counting dual-elig flexibly.
  // Return {legal, d, m, f, note}
  const players = team.map(p=>posList(p));
  // greedy: assign singles first, then duals to satisfy minimums
  let d=0,m=0,f=0, flexible=[];
  players.forEach(el=>{ if(el.length===1){ if(el[0]==='D')d++; else if(el[0]==='M')m++; else f++; } else flexible.push(el); });
  // fill minimums using flexibles
  const need = ()=>({D:Math.max(0,3-d),M:Math.max(0,3-m),F:Math.max(0,1-f)});
  flexible.forEach(el=>{
    const nd=need();
    if(el.includes('D')&&nd.D>0)d++;
    else if(el.includes('M')&&nd.M>0)m++;
    else if(el.includes('F')&&nd.F>0)f++;
    else { if(el.includes('D'))d++; else if(el.includes('M'))m++; else f++; }
  });
  const total=d+m+f;
  const legalShape = d>=3&&d<=5 && m>=3&&m<=5 && f>=1&&f<=3 && (d+m+f)===10;
  let note='';
  if(total<10) note=`${10-total} more starter${total<9?'s':''} needed`;
  else if(total>10) note=`${total-10} over (bench)`;
  else if(!legalShape) note='shape not a valid formation';
  else note=`${d}-${m}-${f} ✓`;
  return {legal:legalShape, d,m,f,total,note};
}

function chip(p, rankAmongAvail){
  if(state.sort==='adp' && p.adp) return `<span class="chip adp">ADP ${p.adp}</span>`;
  if(!p.adp) return '';
  const cls = p.adp>rankAmongAvail*2.2?'steal':(p.adp<rankAmongAvail*0.8?'rich':'adp');
  return `<span class="chip ${cls}">ADP ${p.adp}</span>`;
}

function rowHTML(p, idx, ctx){
  const isT=state.taken.has(p.n), inQ=state.queue.includes(p.n), inT=state.team.includes(p.n);
  let acts='';
  if(ctx==='pool'){
    acts = `${inQ?'':`<button class="act q" data-q="${p.n}">→</button>`}
            ${inT?'':`<button class="act d" data-d="${p.n}">✓</button>`}
            <button class="act x" data-x="${p.n}">✕</button>`;
  } else if(ctx==='queue'){
    acts = `<button class="act d" data-d="${p.n}">✓</button>
            <button class="act x" data-qx="${p.n}">✕</button>`;
  } else if(ctx==='team'){
    acts = `<button class="act x" data-tx="${p.n}">✕</button>`;
  }
  const rk = ctx==='pool'? `<span class="rk">${idx==null?'--':String(idx+1).padStart(2,'0')}</span>`:'';
  const metric = state.sort;
  const mval = metric==='adp'? (p.adp??'–') : (metric==='d'? '+'+p.d.toFixed(2) : p[metric]);
  const qextra = ctx==='queue'? `<span class="grip" data-grip>⠿</span><span class="qorder">${idx+1}</span>` : '';
  const rowcls = `row${isT&&ctx==='pool'?' taken':''}${ctx==='queue'?' qrow':''}`;
  return `<div class="${rowcls}"${ctx==='queue'?` draggable="true" data-qname="${p.n}"`:''}>
    ${qextra}${rk}
    <div class="info">
      <div class="nm">${p.n}</div>
      <div class="meta">${p.c} · ${p.p} · ${p.fpg.toFixed(1)}×${p.gp}${ctx==='pool'?chip(p,(idx??0)+1):` · ${p.v} VORP`}</div>
    </div>
    ${ctx==='pool'?`<div class="vnum"><b>${mval}</b><span>${metric}</span></div>`:''}
    <div class="acts">${acts}</div>
  </div>`;
}

function renderPool(){
  document.getElementById('poolControls').style.display='';
  let rows=DATA.slice();
  if(state.search){ const q=state.search.toLowerCase();
    rows=rows.filter(p=>p.n.toLowerCase().includes(q)||p.c.toLowerCase().includes(q)); }
  rows=rows.filter(p=>{
    if(state.filt==='ALL')return true;
    if(state.filt==='DUAL')return p.p.includes(',');
    if(state.filt==='AVAIL')return !state.taken.has(p.n)&&!state.team.includes(p.n);
    return posList(p).includes(state.filt);
  });
  if(state.sort==='adp') rows.sort((a,b)=>(a.adp??9999)-(b.adp??9999));
  else rows.sort((a,b)=>b[state.sort]-a[state.sort]);
  rows=rows.slice(0,120);
  let avail=0;
  document.getElementById('list').innerHTML = rows.map(p=>{
    const isT=state.taken.has(p.n)||state.team.includes(p.n);
    return rowHTML(p, isT?null:avail++, 'pool');
  }).join('') || `<div class="empty">No players match.</div>`;
}

function renderQueue(){
  document.getElementById('poolControls').style.display='none';
  const live=state.queue.filter(n=>!state.taken.has(n)&&!state.team.includes(n));
  if(live.length===0){ document.getElementById('list').innerHTML=`<div class="empty">Queue is empty. Add targets from the pool with →</div>`; return; }
  document.getElementById('list').innerHTML = live.map((n,i)=>rowHTML(byName(n),i,'queue')).join('');
  wireDrag();
}

function renderTeam(){
  document.getElementById('poolControls').style.display='none';
  const team=state.team.map(byName);
  const f=bestFormation(team);
  const totalV=team.reduce((s,p)=>s+p.v,0);
  const totalP=team.reduce((s,p)=>s+p.pts,0);
  const groups={D:[],M:[],F:[]};
  team.forEach(p=>{ const primary=posList(p)[0]; groups[primary].push(p); });
  let html=`<div class="total"><div><b>${totalP}</b> <span>proj pts</span></div><div><b>${totalV}</b> <span>total VORP</span></div></div>`;
  html+=`<div class="formrow"><span class="lbl">Formation</span>
    <span class="fbadge ${f.legal?'legal':'illegal'}">${f.d}-${f.m}-${f.f}</span>
    <span class="poscount">${f.note} · ${state.team.length} rostered</span></div>`;
  ['D','M','F'].forEach(pos=>{
    const label={D:'Defenders',M:'Midfielders',F:'Forwards'}[pos];
    html+=`<div class="slotgroup"><div class="slothead"><span>${label}</span><span>${groups[pos].length}</span></div>`;
    if(groups[pos].length===0) html+=`<div class="empty">none</div>`;
    else html+=groups[pos].sort((a,b)=>b.v-a.v).map(p=>rowHTML(p,null,'team')).join('');
    html+=`</div>`;
  });
  document.getElementById('list').innerHTML=html;
}

function render(){
  document.getElementById('qb').textContent=state.queue.filter(n=>!state.taken.has(n)&&!state.team.includes(n)).length;
  document.getElementById('tb').textContent=state.team.length;
  if(state.view==='pool')renderPool();
  else if(state.view==='queue')renderQueue();
  else renderTeam();
}

// events
document.querySelectorAll('.vbtn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.vbtn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); state.view=b.dataset.v; render();
});
document.getElementById('sorts').onclick=e=>{ if(!e.target.dataset.s)return;
  document.querySelectorAll('#sorts .ctl').forEach(x=>x.classList.remove('on'));
  e.target.classList.add('on'); state.sort=e.target.dataset.s; render(); };
document.getElementById('filters').onclick=e=>{ if(!e.target.dataset.f)return;
  document.querySelectorAll('#filters .ctl').forEach(x=>x.classList.remove('on'));
  e.target.classList.add('on'); state.filt=e.target.dataset.f; render(); };
document.getElementById('search').oninput=e=>{ state.search=e.target.value; render(); };

document.getElementById('list').addEventListener('click',e=>{
  const t=e.target;
  if(t.dataset.q){ if(!state.queue.includes(t.dataset.q))state.queue.push(t.dataset.q); save(); render(); }
  else if(t.dataset.d){ const n=t.dataset.d;
    if(!state.team.includes(n))state.team.push(n);
    state.queue=state.queue.filter(x=>x!==n); state.taken.delete(n); save(); render(); }
  else if(t.dataset.x){ const n=t.dataset.x;
    state.taken.has(n)?state.taken.delete(n):state.taken.add(n); save(); render(); }
  else if(t.dataset.qx){ state.queue=state.queue.filter(x=>x!==t.dataset.qx); save(); render(); }
  else if(t.dataset.tx){ state.team=state.team.filter(x=>x!==t.dataset.tx); save(); render(); }
});

// --- queue reordering: HTML5 drag (desktop) + touch (mobile) ---
function moveInQueue(name, beforeName){
  const q=state.queue.filter(x=>x!==name);
  if(beforeName==null){ q.push(name); }
  else { const i=q.indexOf(beforeName); q.splice(i,0,name); }
  state.queue=q; save(); render();
}
function wireDrag(){
  const rows=[...document.querySelectorAll('.qrow')];
  let dragName=null;
  rows.forEach(row=>{
    row.addEventListener('dragstart',e=>{ dragName=row.dataset.qname; row.classList.add('dragging'); });
    row.addEventListener('dragend',()=>{ dragName=null; rows.forEach(r=>r.classList.remove('dragging','dragover')); });
    row.addEventListener('dragover',e=>{ e.preventDefault(); row.classList.add('dragover'); });
    row.addEventListener('dragleave',()=>row.classList.remove('dragover'));
    row.addEventListener('drop',e=>{ e.preventDefault(); if(dragName&&dragName!==row.dataset.qname) moveInQueue(dragName,row.dataset.qname); });
  });
  // touch: long-press grip then drag
  let touchName=null, touchY=0;
  rows.forEach(row=>{
    const grip=row.querySelector('[data-grip]'); if(!grip)return;
    grip.addEventListener('touchstart',e=>{ touchName=row.dataset.qname; row.classList.add('dragging'); e.preventDefault(); },{passive:false});
  });
  document.addEventListener('touchmove',e=>{
    if(!touchName)return; e.preventDefault();
    const y=e.touches[0].clientY;
    const over=document.elementFromPoint(e.touches[0].clientX,y)?.closest('.qrow');
    rows.forEach(r=>r.classList.remove('dragover'));
    if(over&&over.dataset.qname!==touchName) over.classList.add('dragover');
  },{passive:false});
  document.addEventListener('touchend',e=>{
    if(!touchName)return;
    const over=document.querySelector('.qrow.dragover');
    if(over&&over.dataset.qname!==touchName) moveInQueue(touchName,over.dataset.qname);
    touchName=null; rows.forEach(r=>r.classList.remove('dragging','dragover'));
  });
}

// --- persistence toolbar ---
const modal=document.getElementById('modal');
document.getElementById('btnExport').onclick=()=>{
  document.getElementById('modalTitle').textContent='Backup code — copy and save in Notes';
  document.getElementById('modalText').value=snapshot();
  modal.classList.add('on');
};
document.getElementById('btnImport').onclick=()=>{
  document.getElementById('modalTitle').textContent='Paste a backup code to restore';
  document.getElementById('modalText').value='';
  modal.classList.add('on');
};
document.getElementById('modalCopy').onclick=()=>{
  const ta=document.getElementById('modalText'); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  navigator.clipboard?.writeText(ta.value).catch(()=>{});
  flash('copied');
};
document.getElementById('modalLoad').onclick=()=>{
  if(restore(document.getElementById('modalText').value)){ save(); modal.classList.remove('on');
    document.querySelectorAll('#sorts .ctl').forEach(x=>x.classList.toggle('on',x.dataset.s===state.sort));
    document.querySelectorAll('#filters .ctl').forEach(x=>x.classList.toggle('on',x.dataset.f===state.filt));
    render(); flash('restored'); }
  else flash('invalid code','warn');
};
document.getElementById('modalClose').onclick=()=>modal.classList.remove('on');
document.getElementById('btnReset').onclick=()=>{
  if(confirm('Clear your team, queue, and taken marks? This cannot be undone.')){
    state.taken=new Set(); state.queue=[]; state.team=[]; save(); render(); flash('reset');
  }
};

// --- boot: restore prior session if present ---
if(storageOK){
  const saved=localStorage.getItem(SAVE_KEY);
  if(saved && restore(saved)){
    document.querySelectorAll('#sorts .ctl').forEach(x=>x.classList.toggle('on',x.dataset.s===state.sort));
    document.querySelectorAll('#filters .ctl').forEach(x=>x.classList.toggle('on',x.dataset.f===state.filt));
  }
  document.getElementById('saveStatus').textContent='auto-saved';
} else {
  document.getElementById('saveStatus').textContent='in-chat preview — download to auto-save';
  document.getElementById('saveStatus').className='savestatus warn';
}

render();
</script>
